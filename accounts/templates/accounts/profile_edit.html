{% extends 'base.html' %}
{% block content %}

<style>
.edit-container {
    max-width: 600px;
    margin: 40px auto;
    background: white;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

.edit-title {
    font-size: 24px;
    font-weight: 700;
    color: #333;
    margin-bottom: 30px;
    text-align: center;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    font-weight: 600;
    color: #555;
    margin-bottom: 6px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 10px 14px;
    border: 2px solid #eee;
    border-radius: 8px;
    font-size: 15px;
    transition: 0.3s;
    box-sizing: border-box;
}

.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #ff7e5f;
}

.save-btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #ff7e5f, #feb47b);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 10px;
}

.save-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(255,126,95,0.3);
}

.cancel-link {
    display: block;
    text-align: center;
    margin-top: 15px;
    color: #888;
    text-decoration: none;
}

.cancel-link:hover {
    color: #ff7e5f;
}
</style>

<div class="edit-container">
    <h2 class="edit-title">✏️ Modifier mon profil</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-group">
            <label>Prénom</label>
            {{ user_form.first_name }}
        </div>
        <div class="form-group">
            <label>Nom</label>
            {{ user_form.last_name }}
        </div>
        <div class="form-group">
            <label>Email</label>
            {{ user_form.email }}
        </div>
        <div class="form-group">
            <label>Bio</label>
            {{ profile_form.bio }}
        </div>
        <div class="form-group">
            <label>Photo de profil</label>
            {{ profile_form.avatar }}
        </div>

        <button type="submit" class="save-btn">💾 Sauvegarder</button>
        <a href="{% url 'accounts:profile' %}" class="cancel-link">Annuler</a>
    </form>
</div>

{% endblock %}
